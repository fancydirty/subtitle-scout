# 自 0.1.0 起：Jellyfin 不再是运行依赖——subtitle-scout 直接扫描磁盘 + TMDB 识别文件，
# 不再打任何媒体服务器的 API。若你之前跑过旧版本，可随时移除 jellyfin 容器/相关 env
# （JELLYFIN_URL / JELLYFIN_API_KEY / MEDIA_PATH_MAPPINGS）——不影响 scout 继续工作。
# 想同时用 Jellyfin 当播放器（和 scout 的字幕功能完全无关，纯粹图省事）？见 docker-compose.bundle.yml。
services:
  subtitle-scout:
    image: ghcr.io/fancydirty/subtitle-scout:latest
    container_name: subtitle-scout
    restart: unless-stopped
    # 容器内 PID 1 默认是 node（Dockerfile CMD 直接跑 dist/cli/index.js）——普通进程不具备
    # init 的孤儿收割职责,异常退出时子孙进程会被重新收养给 PID 1 而 node 不 wait() 它们。
    # init:true 让 Docker 注入内置 tini 作真正的 PID 1,负责收割 + 正确转发终止信号。
    # （历史背景:旧管线曾 detached 起 subtitle-fetch 子进程,僵尸问题更突出;v3 worker 全部
    # 进程内调 adapter,但 tini 的信号/收割卫生依然正确。）
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 健康检查:watch 进程 hang 住时容器状态仍是 running,restart:unless-stopped 救不了。
    # 探测 dashboard 端口(如果启用)或 DB 文件可写。
    # ⚠️ 注意:docker compose 会对 ${...} 做变量插值,JavaScript 模板字符串里的 ${port} 会被吞掉
    # (替换成空串),导致健康检查 100% 失败。必须用 $$ 转义($$ = 字面 $)。
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');const port=process.env.DASHBOARD_PORT||8099;http.get(`http://localhost:$${port}/api/v2/auth/status`,(res)=>{process.exit(res.statusCode===200||res.statusCode===401?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      - "${DASHBOARD_PORT:-8099}:${DASHBOARD_PORT:-8099}"
    # 让 Linux 上也能用 http://host.docker.internal 访问宿主机（macOS/Windows 默认可用）
    # ——例如 LLM_BASE_URL 指向宿主机上跑的本地模型端点（Ollama/LM Studio 等）。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # ── 2026-08-20 用户裁决：env 凭证路径全删 ──────────────────────────────
      # TMDB/LLM/翻译三件套/各字幕源凭证一律在 dashboard 首次设置向导（或设置页）里配置，
      # 落 settings 表的 secret:* 行。compose 不再透传任何凭证——旧写法在 daemon 运行态
      # 本来就不生效（resolver 只读库），留着只会误导部署者以为"塞了 env 就配好了"。
      # 下面只保留**部署基建**：容器起来之前就该定的事（端口/缓存路径/时区/探针路径）。
      # TMDB 反代/代理（墙内直连常被墙时用;不配则默认直连官方 API）——网络层基建，非凭证
      TMDB_BASE_URL: ${TMDB_BASE_URL:-}
      TMDB_PROXY_URL: ${TMDB_PROXY_URL:-}
      TMDB_IMAGE_BASE_URL: ${TMDB_IMAGE_BASE_URL:-}
      # LLM_EXTRA_BODY：env-only 高级项（spec §12，向导不收）——畸形 JSON 会在启动时显式报错
      LLM_EXTRA_BODY: ${LLM_EXTRA_BODY:-}
      # 目标字幕语言与扫描节奏(dashboard 设置页的行为级配置优先于这两个种子值)
      TARGET_LANGUAGES: ${TARGET_LANGUAGES:-}
      SCAN_INTERVAL_MS: ${SCAN_INTERVAL_MS:-}
      LOG_RETAIN_DAYS: ${LOG_RETAIN_DAYS:-}
      # 跳过原产地即目标语言的影视(如目标中文时跳过国产剧,避免为它们空跑找字幕)
      SKIP_CHINESE_ORIGIN: ${SKIP_CHINESE_ORIGIN:-}
      # ffprobe 路径（镜像已内置 ffmpeg，通常无需配置；源码直装且 PATH 无 ffmpeg 时才用）
      # 默认值**必须显式写成镜像里的真实路径**，不能写 `${FFPROBE_PATH:-}`：`:-}` 会把变量
      # **设置成空串**（不是"不设置"），从而覆盖 Dockerfile 的 ENV FFPROBE_PATH=/usr/bin/ffprobe
      # → 生产上探针拿到空路径静默失效（61 个文件 embedded_langs/duration_sec 全 NULL，
      # 日志却报 probe ok=61）。代码侧已把空串归一为"未设置"（streamProbe.ts resolveFfprobeBin），
      # 这里再显式给回镜像默认值是第二道：镜像 npm ci --omit=optional 不装 ffprobe-static，
      # 光靠代码回落这一档在生产镜像里是空的。
      FFPROBE_PATH: ${FFPROBE_PATH:-/usr/bin/ffprobe}
      # 整理归档根（默认库根上一级；高级配置，dashboard 部署页可见）
      REALIGN_ARCHIVE_ROOT: ${REALIGN_ARCHIVE_ROOT:-}
      # 媒体守备目录(dashboard 设置页优先;此处为首启种子,容器内路径)
      # 默认留空：宿主机根挂在 /hostroot 下，目录结构因人而异，无通用默认值可猜。
      # 留空时首启不播种，去 dashboard 设置页用目录浏览器从 /hostroot 里选。
      MEDIA_ROOTS: ${MEDIA_ROOTS:-}
      SUBTITLE_SCOUT_CACHE_DIR: /cache
      TZ: ${TZ:-Asia/Shanghai}
      DASHBOARD_PORT: ${DASHBOARD_PORT:-8099}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      DASHBOARD_TOKEN: ${DASHBOARD_TOKEN:-}
    volumes:
      # 宿主机根目录挂载到 /hostroot——用户通过 UI 自由选择要扫描的目录，不再硬编码 Movies/TV
      - /:/hostroot
      - ./cache:/cache
