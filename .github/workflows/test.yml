name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  # 后端：src/ 的类型检查 + 单测
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # 根 tsc 会被 src 里跨工程契约测试拉到 web/src（导入 React 组件），
      # 只装根依赖时 react 解析不到——两个工程都装，主 job 才真的在查同一份代码。
      - run: npm ci --prefix web
      - run: npx tsc --noEmit
      - run: npx vitest run

  # 前端：web/ 有独立 package.json + vitest，根 tsconfig 的 include 只有 ["src"]——
  # 不单独起一个 job，web 的 299 个测试和 TypeScript 错误永远进不了 CI（审计三轮 R3 发现：
  # 这些测试"上次在 CI 里运行的时间从未存在过"）。
  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # web tsc 会经 ../src 反向检查后端文件（zod/undici/@types/node 等），
      # 所以根依赖也要先装上，否则缺 node/zod 类型。
      - run: npm ci
      - run: npm ci
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web
      - run: npx vitest run
        working-directory: web
