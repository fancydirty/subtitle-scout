# v(next)：Jellyfin 不再是运行依赖——subtitle-scout 直接扫描磁盘 + TMDB 识别文件，
# 不再打任何媒体服务器的 API。这个本地测试栈相应地不再拉起 jellyfin 容器；
# 旧版本留下的 jellyfin-config-local 卷可按需自行清理（docker volume rm）。
# OrbStack 本地全链路测试栈：本地构建 scout + mock 媒体库。
# 用法：
#   scripts/gen-mock-library.sh
#   cp .env.example .env   # 填三把钥匙
#   docker compose -f docker-compose.local.yml up -d --build
services:
  subtitle-scout:
    build: .
    container_name: subtitle-scout-local
    restart: unless-stopped
    # 容器内 PID 1 是 node（Dockerfile CMD 直接跑 dist/cli/index.js）——但普通进程
    # 不具备 init 的孤儿收割职责。旧管线曾 detached 起 subtitle-fetch 子进程（已退役,
    # v3 全部进程内调 adapter），但 init:true 的信号/收割卫生依然正确。
    init: true
    ports:
      - "8099:8099"
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      LLM_EXTRA_BODY: ${LLM_EXTRA_BODY:-}
      ASSRT_TOKEN: ${ASSRT_TOKEN}
      TMDB_API_KEY: ${TMDB_API_KEY}
      OPENSUBTITLES_API_KEY: ${OPENSUBTITLES_API_KEY:-}
      OPENSUBTITLES_USERNAME: ${OPENSUBTITLES_USERNAME:-}
      OPENSUBTITLES_PASSWORD: ${OPENSUBTITLES_PASSWORD:-}
      ZIMUKU_ENABLED: ${ZIMUKU_ENABLED:-false}
      SUBHD_ENABLED: ${SUBHD_ENABLED:-false}
      TMDB_BASE_URL: ${TMDB_BASE_URL:-}
      TMDB_PROXY_URL: ${TMDB_PROXY_URL:-}
      JIMAKU_API_KEY: ${JIMAKU_API_KEY:-}
      TRANSLATE_BASE_URL: ${TRANSLATE_BASE_URL:-}
      TRANSLATE_API_KEY: ${TRANSLATE_API_KEY:-}
      TRANSLATE_MODEL: ${TRANSLATE_MODEL:-}
      TRANSLATE_CRITIC: ${TRANSLATE_CRITIC:-}
      TRANSLATE_CRITIC_MODEL: ${TRANSLATE_CRITIC_MODEL:-}
      TRANSLATE_TIMEOUT_MS: ${TRANSLATE_TIMEOUT_MS:-}
      TARGET_LANGUAGES: ${TARGET_LANGUAGES:-}
      SCAN_INTERVAL_MS: ${SCAN_INTERVAL_MS:-}
      LOG_RETAIN_DAYS: ${LOG_RETAIN_DAYS:-}
      SKIP_CHINESE_ORIGIN: ${SKIP_CHINESE_ORIGIN:-}
      SUBTITLE_SCOUT_CACHE_DIR: /cache
      MEDIA_ROOTS: /media
      TZ: ${TZ:-Asia/Shanghai}
      DASHBOARD_PORT: "8099"
      DASHBOARD_TOKEN: ${DASHBOARD_TOKEN:-}
    volumes:
      - ./fixtures/media:/media
      - ./cache-local:/cache
