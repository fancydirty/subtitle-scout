# v(next)：Jellyfin 不再是 subtitle-scout 的运行依赖——它直接扫描磁盘 + TMDB 识别文件，
# 不再打任何媒体服务器的 API。这份"全家桶"因此不再有功能上的特殊性：下面的 jellyfin
# 服务纯粹是"顺手给你一个播放器"的可选附赠，与 scout 找字幕/整理这条主线完全无关——
# 只想跑 scout 本体，直接用 docker-compose.yml 即可，效果等价且少一个容器。
# 用法：cp .env.example .env 填好三把钥匙与 MEDIA_HOST_PATH，然后
#   docker compose -f docker-compose.bundle.yml up -d
# 注意：Jellyfin（如果你要用它当播放器）首次运行需先完成初始向导（http://<主机>:8096）。
services:
  jellyfin:
    image: ghcr.io/jellyfin/jellyfin:latest
    container_name: scout-jellyfin
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8096:8096"
    volumes:
      - ./jellyfin-config:/config
      # ⚠️ 强制守卫: MEDIA_HOST_PATH 未设置时直接报错（与 subtitle-scout 服务一致）
      - ${MEDIA_HOST_PATH:?MEDIA_HOST_PATH 未设置，请在 .env 里填宿主机媒体库根目录}/Movies:/media/movies
      - ${MEDIA_HOST_PATH:?MEDIA_HOST_PATH 未设置，请在 .env 里填宿主机媒体库根目录}/TV:/media/tv

  subtitle-scout:
    image: ghcr.io/fancydirty/subtitle-scout:latest
    container_name: subtitle-scout
    restart: unless-stopped
    # 容器内 PID 1 是 node（Dockerfile CMD 直接跑 dist/cli/index.js）——但普通进程
    # 不具备 init 的孤儿收割职责。旧管线曾 detached 起 subtitle-fetch 子进程（已退役,
    # v3 全部进程内调 adapter），但 init:true 的信号/收割卫生依然正确。
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 与主 compose 同款健康检查（⚠️ $$ 转义：compose 会吞掉 ${...}，见 docker-compose.yml 注释）
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');const port=process.env.DASHBOARD_PORT||8099;http.get(`http://localhost:$${port}/api/v2/auth/status`,(res)=>{process.exit(res.statusCode===200||res.statusCode===401?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      - "${DASHBOARD_PORT:-8099}:${DASHBOARD_PORT:-8099}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      LLM_EXTRA_BODY: ${LLM_EXTRA_BODY:-}
      ASSRT_TOKEN: ${ASSRT_TOKEN}
      TMDB_API_KEY: ${TMDB_API_KEY}
      OPENSUBTITLES_API_KEY: ${OPENSUBTITLES_API_KEY:-}
      OPENSUBTITLES_USERNAME: ${OPENSUBTITLES_USERNAME:-}
      OPENSUBTITLES_PASSWORD: ${OPENSUBTITLES_PASSWORD:-}
      # 字幕源开关：默认关（各自需额外配置）
      ZIMUKU_ENABLED: ${ZIMUKU_ENABLED:-false}
      SUBHD_ENABLED: ${SUBHD_ENABLED:-false}
      # TMDB 反代/代理（墙内直连常被墙时用）
      TMDB_BASE_URL: ${TMDB_BASE_URL:-}
      TMDB_PROXY_URL: ${TMDB_PROXY_URL:-}
      # jimaku 日字源(F2)
      JIMAKU_API_KEY: ${JIMAKU_API_KEY:-}
      # AI 翻译部署门:三件套缺一,daemon 自动翻译整体休眠
      TRANSLATE_BASE_URL: ${TRANSLATE_BASE_URL:-}
      TRANSLATE_API_KEY: ${TRANSLATE_API_KEY:-}
      TRANSLATE_MODEL: ${TRANSLATE_MODEL:-}
      TRANSLATE_CRITIC: ${TRANSLATE_CRITIC:-}
      TRANSLATE_CRITIC_MODEL: ${TRANSLATE_CRITIC_MODEL:-}
      TRANSLATE_TIMEOUT_MS: ${TRANSLATE_TIMEOUT_MS:-}
      # 目标字幕语言与扫描节奏(dashboard 设置页优先)
      TARGET_LANGUAGES: ${TARGET_LANGUAGES:-}
      SCAN_INTERVAL_MS: ${SCAN_INTERVAL_MS:-}
      LOG_RETAIN_DAYS: ${LOG_RETAIN_DAYS:-}
      SKIP_CHINESE_ORIGIN: ${SKIP_CHINESE_ORIGIN:-}
      # ffprobe 路径（镜像已内置 ffmpeg，通常无需配置；源码直装且 PATH 无 ffmpeg 时才用）
      FFPROBE_PATH: ${FFPROBE_PATH:-}
      # 整理归档根（默认库根上一级；容器挂载下建议显式配，见 .env.example）
      REALIGN_ARCHIVE_ROOT: ${REALIGN_ARCHIVE_ROOT:-}
      # 媒体守备目录(dashboard 设置页优先;此处为首启种子,容器内路径)
      MEDIA_ROOTS: ${MEDIA_ROOTS:-/media}
      SUBTITLE_SCOUT_CACHE_DIR: /cache
      TZ: ${TZ:-Asia/Shanghai}
      DASHBOARD_PORT: ${DASHBOARD_PORT:-8099}
      DASHBOARD_TOKEN: ${DASHBOARD_TOKEN:-}
    volumes:
      # 宿主机 Movies/ TV/ → 容器内 movies/ tv/(小写,Linux 容器大小写敏感)
      # ⚠️ 强制守卫: MEDIA_HOST_PATH 未设置时直接报错
      - ${MEDIA_HOST_PATH:?MEDIA_HOST_PATH 未设置，请在 .env 里填宿主机媒体库根目录}/Movies:/media/movies
      - ${MEDIA_HOST_PATH:?MEDIA_HOST_PATH 未设置，请在 .env 里填宿主机媒体库根目录}/TV:/media/tv
      - ./cache:/cache
